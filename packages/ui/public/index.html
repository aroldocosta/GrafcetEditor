<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <title>Drag & Drop GRAFCET</title>
  <link rel="stylesheet" href="modal.css">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="palette">
    <div class="palette-title">Start</div>
    <div class="box start_step" draggable="true" data-state="inactive">
      <div class="line-top start"></div>
      <div class="inner-rect"></div>
      <div class="line-bottom start"></div>
      <div class="transition start"></div>
      <div class="connector top start"></div>
      <div class="connector bottom start"></div>
    </div>

    <div class="palette-title">Active</div>
    <div class="box active_step" draggable="true" data-state="inactive">
      <div class="line-top active"></div>
      <div class="inner-rect"></div>
      <div class="line-bottom active"></div>
      <div class="transition active"></div>
      <div class="connector top active"></div>
      <div class="connector bottom active"></div>
    </div>

    <div class="palette-title">Divergência OR</div>
    <div class="box or_divergence" draggable="true" data-type="or_divergence">
      <div class="connector top center"></div>
      <div class="branch-stem-top"></div>
      <div class="branch-bar"></div>
      <div class="branch-legs bottom">
        <div class="branch-leg left">
          <div class="branch-stem-bottom"></div>
          <div class="branch-transition" data-branch="0" title="Clique para editar receptividade"></div>
          <div class="connector bottom" data-branch="0"></div>
        </div>
        <div class="branch-leg right">
          <div class="branch-stem-bottom"></div>
          <div class="branch-transition" data-branch="1" title="Clique para editar receptividade"></div>
          <div class="connector bottom" data-branch="1"></div>
        </div>
      </div>
    </div>

    <div class="palette-title">Convergência OR</div>
    <div class="box or_convergence" draggable="true" data-type="or_convergence">
      <div class="branch-legs top">
        <div class="branch-leg left">
          <div class="connector top" data-branch="0"></div>
          <div class="branch-stem-top"></div>
        </div>
        <div class="branch-leg right">
          <div class="connector top" data-branch="1"></div>
          <div class="branch-stem-top"></div>
        </div>
      </div>
      <div class="branch-bar"></div>
      <div class="branch-stem-bottom"></div>
      <div class="connector bottom center"></div>
    </div>

    <button class="palette-btn btn-compile" onclick="doCompile()">COMPILAR</button>
    <button class="palette-btn btn-export" onclick="exportDiagram()">EXPORTAR JSON</button>
    <button class="palette-btn btn-import" onclick="triggerImportDiagram()">IMPORTAR JSON</button>
    <button class="palette-btn btn-clear" onclick="clearDiagram()">LIMPAR DIAGRAMA</button>
    <input type="file" id="import-file-input" accept=".json" style="display: none;" onchange="handleImportFile(event)">
  </div>

  <div id="canvas-viewport">
    <div id="canvas">
      <div class="quadrant-divider vertical"></div>
      <div class="quadrant-divider horizontal"></div>
      <span class="sheet-label sheet-1">Folha 1</span>
      <span class="sheet-label sheet-2">Folha 2</span>
      <span class="sheet-label sheet-3">Folha 3</span>
      <span class="sheet-label sheet-4">Folha 4</span>
    </div>

    <!-- Controles de Navegação Flutuantes -->
    <div id="nav-controls">
      <button class="nav-btn" id="nav-up" title="Mover para Cima">▲</button>
      <div class="nav-row">
        <button class="nav-btn" id="nav-left" title="Mover para Esquerda">◄</button>
        <button class="nav-btn" id="nav-center" title="Centralizar Visão">🎯</button>
        <button class="nav-btn" id="nav-right" title="Mover para Direita">►</button>
      </div>
      <button class="nav-btn" id="nav-down" title="Mover para Baixo">▼</button>
    </div>
  </div>

  <script src="step.js?v=10"></script>
  <script src="transition.js?v=10"></script>
  <script src="action.js?v=10"></script>
  <script src="script.js?v=10"></script>
  <script src="compiler.js?v=10"></script>
</body>

</html>
